<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okoskaptár Webes Felület</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <i class="fa-solid fa-hexagon"></i> Okoskaptár
    </div>
    <div class="mt-3">
        <a class="menu-item active" onclick="switchTab('hives', this)"><i class="fa-solid fa-server"></i> Kaptárok</a>
        <a class="menu-item" onclick="switchTab('graphs', this)"><i class="fa-solid fa-chart-line"></i> Elemzések</a>
    </div>
    <div class="sidebar-footer">
        © 2026 Szakdolgozati Projekt
    </div>
</div>

<div id="main-content">
    
    <div class="topbar">
        <div class="d-flex align-items-center">
            <i class="fa-solid fa-bars mobile-menu-btn" onclick="toggleMobileMenu()"></i>
            <h2 id="page-title">Irányítópult</h2>
        </div>
        <div>
            <button id="smsToggleBtn" class="btn btn-sm btn-outline-danger shadow-sm" onclick="toggleSMS()">
                <i class="fa-solid fa-spinner fa-spin"></i> Betöltés...
            </button>
        </div>
    </div>

    <div id="view-hives">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="m-0 text-muted">Aktív Kaptárok</h5>
            <div>
                <button class="btn btn-sm btn-success shadow-sm" onclick="allGates(1)"><i class="fa-solid fa-lock-open"></i> Összes Nyitása</button>
                <button class="btn btn-sm btn-secondary shadow-sm" onclick="allGates(0)"><i class="fa-solid fa-lock"></i> Összes Zárása</button>
            </div>
        </div>
        
        <div id="kaptar-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="text-center w-100 mt-5"><div class="spinner-border text-warning"></div></div>
        </div>
    </div>

    <div id="view-graphs" style="display: none;">
        <div class="card p-4 border-0 shadow-sm mb-4">
            <div class="d-flex justify-content-between mb-3">
                <h5 class="m-0 text-muted">Adatvizualizáció</h5>
                <div class="d-flex gap-2">
                    <select id="graphTimeSelect" class="form-select form-select-sm w-auto" onchange="loadGraphs()">
                        <option value="3">Elmúlt 3 óra</option>
                        <option value="6">Elmúlt 6 óra</option>
                        <option value="12">Elmúlt 12 óra</option>
                        <option value="24" selected>Elmúlt 24 óra</option>
                        <option value="48">Elmúlt 2 nap</option>
                        <option value="0">Összes adat</option>
                    </select>

                    <select id="graphHiveSelect" class="form-select form-select-sm w-auto" onchange="loadGraphs()">
                    </select>
                </div>
            </div>
            
            <h6 class="text-muted mt-3">Hőmérséklet (°C)</h6>
            <canvas id="tempChart" height="80"></canvas>

            <h6 class="text-muted mt-5">Akusztikus Frekvencia (Hz)</h6>
            <canvas id="freqChart" height="80"></canvas>
        </div>
    </div>
    
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
